name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  TREE_SITTER_CLI_VERSION: 0.26.13

jobs:
  rust:
    name: Rust workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The C runtime has per-platform code (fibers vs ucontext, Winsock vs
        # BSD sockets), so every platform builds and runs real programs.
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # vendored TinyCC, compiled by sirin-codegen-c/build.rs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - name: Smoke test (build and run programs)
        run: |
          exe=""; if [[ "$RUNNER_OS" == "Windows" ]]; then exe=".exe"; fi
          sirin="target/debug/sirin$exe"
          for f in print try strops collections async async_await; do
            "$sirin" build "examples/$f.sn"
            echo "--- $f"
            "examples/$f$exe"
          done
          "$sirin" build examples/chat/server.sn
          "$sirin" build examples/chat/client.sn
          # the HTTP example runs forever: start it, query it, stop it
          "$sirin" build examples/http/demo.sn
          # (output to a file, so the server never holds the step's stdout open)
          "examples/http/demo$exe" > server.log 2>&1 & server=$!
          sleep 2
          curl -sf --retry 3 --retry-connrefused -m 10 http://127.0.0.1:8080/ | tee response.txt || true
          kill "$server" 2>/dev/null || true
          if [[ "$RUNNER_OS" == "Windows" ]]; then taskkill //F //IM demo.exe > /dev/null 2>&1 || true; fi
          cat server.log
          grep -q "hello from sirin" response.txt

  grammar:
    name: Tree-sitter grammar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/tree-sitter-sirin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli@${{ env.TREE_SITTER_CLI_VERSION }}
      - name: Check generated parser is up to date
        run: |
          tree-sitter generate
          git diff --exit-code -- src || {
            echo "::error::src/ is stale. Run 'tree-sitter generate' in editors/tree-sitter-sirin and commit."
            exit 1
          }
      - name: Compile grammar
        run: tree-sitter build
      - name: Check Zed extension rev matches grammar
        working-directory: .
        run: |
          rev=$(sed -n '/^\[grammars\.sirin\]/,/^\[/ s/^rev *= *"\([0-9a-f]*\)"/\1/p' editors/zed/extension.toml)
          echo "extension.toml rev: $rev"
          git cat-file -e "$rev^{commit}" || {
            echo "::error file=editors/zed/extension.toml::rev $rev not found in repository"
            exit 1
          }
          git diff --quiet "$rev" HEAD -- editors/tree-sitter-sirin || {
            echo "::error file=editors/zed/extension.toml::Grammar changed since rev $rev. Bump rev to the latest commit touching editors/tree-sitter-sirin."
            exit 1
          }

  zed-extension:
    name: Zed extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/zed
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editors/zed
      - run: cargo build --release --target wasm32-wasip2
