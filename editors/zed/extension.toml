id = "sirin"
name = "Sirin"
description = "Sirin language support (diagnostics, hover, go-to-definition)"
version = "0.1.0"
schema_version = 1
authors = ["Sirin contributors"]
repository = "https://github.com/KingTimer12/sirin"

[language_servers.sirin-lsp]
name = "Sirin Language Server"
languages = ["Sirin"]

# Grammar lives in this same repo, under editors/tree-sitter-sirin. Zed clones
# `repository` at `rev`, so the grammar must be committed and reachable there —
# bump `rev` after changing grammar.js and pushing (CI checks this).
[grammars.sirin]
repository = "https://github.com/KingTimer12/sirin"
rev = "6feb63543bbd4cfadadb61f714c025096e4455c9"
path = "editors/tree-sitter-sirin"
